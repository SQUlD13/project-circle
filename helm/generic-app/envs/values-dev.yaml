global:
  environment: dev

image:
  repository: 530424100135.dkr.ecr.eu-west-1.amazonaws.com/project-circle-nginx
  tag: "dev-latest"

ingress:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
  hosts:
    - paths:
        - path: /dev(/|$)(.*)
          pathType: ImplementationSpecific

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

externalSecret:
  enabled: true
  secretStore: aws-secrets-manager
  refreshInterval: 1h
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    - secretKey: EXAMPLE_SECRET
      remoteRef:
        key: project-circle-dev/app/config
        property: example_secret
